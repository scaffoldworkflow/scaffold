<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="//cdn.muicss.com/mui-0.10.3/css/mui.min.css" rel="stylesheet" type="text/css" />
    <link href="./scaffold.css" rel="stylesheet" type="text/css" />
    <script src="//cdn.muicss.com/mui-0.10.3/js/mui.min.js"></script>
    <script src="//code.jquery.com/jquery-2.1.4.min.js"></script>
    <style type="text/css" src="./scaffold.css">
        @keyframes mui-btn-inserted {
            from {
                transform: none;
            }

            to {
                transform: none;
            }
        }

        .mui-btn {
            animation-duration: 0.0001s;
            animation-name: mui-btn-inserted;
        }

        @keyframes mui-dropdown-inserted {
            from {
                transform: none;
            }

            to {
                transform: none;
            }
        }

        [data-mui-toggle="dropdown"] {
            animation-duration: 0.0001s;
            animation-name: mui-dropdown-inserted;
        }

        @keyframes mui-btn-inserted,
        mui-dropdown-inserted {
            from {
                transform: none;
            }

            to {
                transform: none;
            }
        }

        .mui-btn[data-mui-toggle="dropdown"] {
            animation-duration: 0.0001s;
            animation-name: mui-btn-inserted, mui-dropdown-inserted;
        }

        @keyframes mui-tab-inserted {
            from {
                transform: none;
            }

            to {
                transform: none;
            }
        }

        [data-mui-toggle="tab"] {
            animation-duration: 0.0001s;
            animation-name: mui-tab-inserted;
        }

        @keyframes mui-textfield-inserted {
            from {
                transform: none;
            }

            to {
                transform: none;
            }
        }

        .mui-textfield>input {
            animation-duration: 0.0001s;
            animation-name: mui-textfield-inserted;
        }

        @keyframes mui-textfield-inserted {
            from {
                transform: none;
            }

            to {
                transform: none;
            }
        }

        .mui-textfield>textarea {
            animation-duration: 0.0001s;
            animation-name: mui-textfield-inserted;
        }

        @keyframes mui-select-inserted {
            from {
                transform: none;
            }

            to {
                transform: none;
            }
        }

        .mui-select>select {
            animation-duration: 0.0001s;
            animation-name: mui-select-inserted;
        }

        @keyframes mui-node-inserted {
            from {
                transform: none;
            }

            to {
                transform: none;
            }
        }

        .mui-select>select~.mui-event-trigger {
            animation-duration: 0.0001s;
            animation-name: mui-node-inserted;
        }

        @keyframes mui-node-disabled {
            from {
                transform: none;
            }

            to {
                transform: none;
            }
        }

        .mui-select>select:disabled~.mui-event-trigger {
            animation-duration: 0.0001s;
            animation-name: mui-node-disabled;
        }
    </style>
    <style>
        /**
        * Body CSS
        */

        html,
        body {
            height: 100%;
            background-color: #646464;
        }

        html,
        body,
        input,
        textarea,
        button {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-shadow: 1px 1px 1px rgba(0, 0, 0, 0.004);
        }

        .mui-appbar {
            background-color: #A3BE8C;
        }

        /**
        * Layout CSS
        */

        #header {
            position: fixed;
            top: 0;
            right: 0;
            left: 0;
            z-index: 2;
            transition: left 0.2s;
        }

        #sidedrawer {
            position: fixed;
            top: 0;
            bottom: 0;
            width: 200px;
            left: -200px;
            overflow: auto;
            z-index: 2;
            background-color: #4b4b4b;
            transition: transform 0.2s;
        }

        #content-wrapper {
            min-height: 100%;
            overflow-x: hidden;
            margin-left: 0px;
            transition: margin-left 0.2s;

            /* sticky bottom */
            box-sizing: border-box;
            margin-bottom: -160;
            padding-bottom: 32px;
        }

        #footer {
            box-sizing: border-box;
            height: 32px;
            margin-left: 0px;
            transition: margin-left 0.2s;
        }

        @media (min-width: 768px) {
            #header {
                left: 200px;
            }

            #sidedrawer {
                transform: translate(200px);
            }

            #content-wrapper {
                margin-left: 200px;
            }

            #footer {
                margin-left: 200px;
            }

            body.hide-sidedrawer #header {
                left: 0;
            }

            body.hide-sidedrawer #sidedrawer {
                transform: translate(0px);
            }

            body.hide-sidedrawer #content-wrapper {
                margin-left: 0;
            }

            body.hide-sidedrawer #footer {
                margin-left: 0;
            }
        }


        /**
        * Toggle Sidedrawer
        */
        #sidedrawer.active {
            transform: translate(200px);
        }


        /**
        * Header CSS
        */

        .sidedrawer-toggle {
            color: #fff;
            cursor: pointer;
            font-size: 20px;
            line-height: 20px;
            margin-right: 10px;
        }

        .sidedrawer-toggle:hover {
            color: #fff;
            text-decoration: none;
        }


        /**
        * Sidedrawer CSS
        */

        #sidedrawer-brand {
            padding-left: 20px;
        }

        #sidedrawer ul {
            list-style: none;
        }

        #sidedrawer>ul {
            padding-left: 0px;
        }

        #sidedrawer>ul>li:first-child {
            padding-top: 15px;
        }

        #sidedrawer strong {
            display: block;
            padding: 15px 22px;
            cursor: pointer;
        }

        #sidedrawer strong:hover {
            background-color: #A3BE8C;
        }

        #sidedrawer strong+ul>li {
            padding: 6px 0px;
        }


        /**
        * Footer CSS
        */

        #footer {
            background-color: #A3BE8C;
            color: #fff;
        }

        #footer a {
            color: #fff;
            text-decoration: underline;
        }
    </style>
    <style>
        /**
        * Scaffold CSS
        */

        .scaffold-green {
            background-color: #A3BE8C;
        }

        .scaffold-text-green {
            color: #A3BE8C;
        }

        .scaffold-hover-green:hover {
            background-color: #A3BE8C;
        }

        .mui-tabs__pane {
            padding: 16px;
        }

        .no-bullets {
            list-style-type: none;
        }

        /* .mui--is-active {
            color: #A3BE8C;
        } */
    </style>
    <script>
        jQuery(function ($) {
            var $bodyEl = $('body'),
                $sidedrawerEl = $('#sidedrawer');


            // ==========================================================================
            // Toggle Sidedrawer
            // ==========================================================================
            function showSidedrawer() {
                // show overlay
                var options = {
                    onclose: function () {
                        $sidedrawerEl
                            .removeClass('active')
                            .appendTo(document.body);
                    }
                };

                var $overlayEl = $(mui.overlay('on', options));

                // show element
                $sidedrawerEl.appendTo($overlayEl);
                setTimeout(function () {
                    $sidedrawerEl.addClass('active');
                }, 20);
            }


            function hideSidedrawer() {
                $bodyEl.toggleClass('hide-sidedrawer');
            }


            $('.js-show-sidedrawer').on('click', showSidedrawer);
            $('.js-hide-sidedrawer').on('click', hideSidedrawer);


            // ==========================================================================
            // Animate menu
            // ==========================================================================
            var $titleEls = $('strong', $sidedrawerEl);

            $titleEls
                .next()
                .hide();

            $titleEls.on('click', function () {
                $(this).next().slideToggle(200);
            });
        });

    </script>
</head>

<body>
    <div id="sidedrawer" class="mui--no-user-select">
        <div id="sidedrawer-brand" class="mui--appbar-line-height">
            <span class="mui--text-title scaffold-text-green" style="padding-left:16px;">Scaffold</span>
        </div>
        <div class="mui-divider scaffold-green"></div>
        <ul>
            {{ range $team, $projects := .teams }}
            <li>
                <strong>{{ $team }}</strong>
                {{ range $projects }}
                <ul style="display: none;" class="scaffold-hover-green">
                    <li><a href="/ui/projects/{{ . }}" class="scaffold-text-green">{{ . }}</a></li>
                </ul>
                {{ end }}
            </li>
            {{ end }}
        </ul>
    </div>
    <header id="header">
        <div class="mui-appbar mui--appbar-line-height">
            <div class="mui-container-fluid">
                <a
                    class="sidedrawer-toggle mui--visible-xs-inline-block mui--visible-sm-inline-block js-show-sidedrawer">☰</a>
                <a class="sidedrawer-toggle mui--hidden-xs mui--hidden-sm js-hide-sidedrawer">☰</a>
                <span class="mui--text-title mui--visible-xs-inline-block">Scaffold</span>
            </div>
        </div>
    </header>
    <div id="content-wrapper" style="padding-top:64px;">
        {{ .contents }}
